plugins {
  id 'application'
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco'
  id 'maven-publish'
  id 'com.github.ben-manes.versions' version '0.61.0'
  id 'org.cyclonedx.bom' version '3.4.1'
  id 'com.gorylenko.gradle-git-properties' version '4.0.1'
  id 'com.avast.gradle.docker-compose' version '0.17.21'
}

group = 'uk.gov.hmcts.cp'
version = System.getProperty('ARTEFACT_VERSION') ?: '0.0.999'

apply {
  from("$rootDir/gradle/repositories.gradle")
  from("$rootDir/gradle/java.gradle")
  from("$rootDir/gradle/dependency.gradle")
  from("$rootDir/gradle/pmd.gradle")
  from("$rootDir/gradle/test.gradle")
  from("$rootDir/gradle/jar.gradle")
  from("$rootDir/gradle/docker-test.gradle")
}

// We MUST keep all dependencies in the build.gradle to allow dependabot to provide version updates
// Sadly, dependabot does not track dependencies in the apply-from files
dependencies {
  // Api spec
  implementation('uk.gov.hmcts.cp:api-cp-crime-results-pcr:1.1.20') // AMP-1081: defendantType on CourtApplication
  implementation 'io.swagger.core.v3:swagger-annotations:2.2.55'

  // Java core
  implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
  implementation 'org.owasp.encoder:encoder:1.4.0'

  compileOnly 'org.projectlombok:lombok:1.18.48'
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

  // Spring boot core
  implementation 'org.springframework.boot:spring-boot-starter-web'
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  testImplementation('org.springframework.boot:spring-boot-starter-test') {
    exclude group: 'junit', module: 'junit'
    exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  }
  testImplementation 'org.wiremock:wiremock-standalone:3.13.2'

  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

  implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'

  // Spring boot database / postgres
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.postgresql:postgresql'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'

  // read-only from this service's side, no new cache write path introduced
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'

  implementation 'com.azure:azure-messaging-servicebus:7.17.20'
  implementation 'com.azure:azure-identity:1.18.6'
  implementation 'org.awaitility:awaitility:4.3.0'
}
