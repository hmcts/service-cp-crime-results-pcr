name: CI Build and Publish

on:
  workflow_call:
    secrets:
      AZURE_DEVOPS_ARTIFACT_USERNAME:
        required: true
      AZURE_DEVOPS_ARTIFACT_TOKEN:
        required: true
      HMCTS_ADO_PAT:
        required: true
      DEPLOYMENT_APP_ID:
        required: true
        description: "GitHub App ID for deployment"
      DEPLOYMENT_APP_PRIVATE_KEY:
        required: true
        description: "GitHub App private key for deployment"
      # Smoke-test URLs: plain repo-level secrets, DEV_ prefixed (design doc §6/§8/§10) - not a
      # "dev" GitHub Environment. Repo-level secrets must be declared here and passed through
      # explicitly by the caller (ci-draft.yml); unlike environment-scoped secrets, they do NOT
      # resolve automatically just because a job declares `environment: name: dev`. The remaining
      # dev smoke-test creds (CJSCPPUID, SMOKE_ENTRA_*, SMOKE_APIM_SUBSCRIPTION_KEY below) still
      # live on the "dev" Environment and don't need declaring here for that reason.
      DEV_SMOKE_SERVICE_BASE_URL:
        required: false
      DEV_CP_BACKEND_URL:
        required: false
    inputs:
      environment:
        required: true
        type: string
        default: dev
      is_release:
        required: false
        type: boolean
        default: false
      is_publish:
        required: true
        type: boolean
      trigger_docker:
        required: true
        type: boolean
      trigger_deploy:
        required: true
        type: boolean
      deploy_dev:
        required: false
        type: boolean
        default: true
      deploy_sit:
        required: false
        type: boolean
        default: false
      deploy_environment:
        required: false
        type: string
        default: dev


jobs:
  Artefact-Version:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    outputs:
      artefact_version: ${{ inputs.is_release && steps.artefact.outputs.release_version || steps.artefact.outputs.draft_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Artefact Version
        id: artefact
        uses: hmcts/artefact-version-action@v1
        with:
          release: ${{ inputs.is_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Build:
    needs: [Artefact-Version]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    outputs:
      repo_name: ${{ steps.repo_vars.outputs.repo_name }}
      artefact_name: ${{ steps.repo_vars.outputs.artefact_name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Gradle Build
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
        run: |
          echo "Building with ARTEFACT_VERSION=$ARTEFACT_VERSION"
          ./gradlew composeUp
          ./gradlew build -DARTEFACT_VERSION=$ARTEFACT_VERSION
          ./gradlew composeDown

      - name: Extract repo name
        id: repo_vars
        run: |
          repo_name=${GITHUB_REPOSITORY##*/}
          echo "repo_name=${repo_name}" >> $GITHUB_OUTPUT
          echo "artefact_name=${repo_name}-${{ needs.Artefact-Version.outputs.artefact_version }}" >> $GITHUB_OUTPUT

      - name: Upload JAR Artefact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/${{ steps.repo_vars.outputs.artefact_name }}.jar

  Provider-Deploy:
    needs: [ Artefact-Version, Build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Gradle Publish
        if: ${{ inputs.is_publish }}
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
        run: |
          if [ -z "AZURE_DEVOPS_ARTIFACT_USERNAME" ]; then
            echo "::warning::AZURE_DEVOPS_ARTIFACT_USERNAME is null or not set"
          fi

          if [ -z "$AZURE_DEVOPS_ARTIFACT_TOKEN" ]; then
            echo "::warning::AZURE_DEVOPS_ARTIFACT_TOKEN is null or not set"
          fi

          echo "Publishing artefact for version: $ARTEFACT_VERSION"
          
          ./gradlew publish \
            -DARTEFACT_VERSION=$ARTEFACT_VERSION \
            -DGITHUB_REPOSITORY=${{ github.repository }} \
            -DGITHUB_ACTOR=${{ github.actor }} \
            -DGITHUB_TOKEN=$GITHUB_TOKEN \
            -DAZURE_DEVOPS_ARTIFACT_USERNAME=$AZURE_DEVOPS_ARTIFACT_USERNAME \
            -DAZURE_DEVOPS_ARTIFACT_TOKEN=$AZURE_DEVOPS_ARTIFACT_TOKEN

  Build-Docker:
    needs: [ Provider-Deploy, Build, Artefact-Version ]
    if: ${{ inputs.trigger_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download JAR Artefact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GitHub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.Artefact-Version.outputs.artefact_version }}
          build-args: |
            BASE_IMAGE=eclipse-temurin:25
            JAR_FILENAME=${{ needs.Build.outputs.artefact_name }}.jar

  Trigger-ACR-Copy:
    needs: [ Provider-Deploy, Build, Artefact-Version ]
    if: ${{ inputs.trigger_deploy }}
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.trigger.outputs.run_id }}
    steps:
      - name: Extract repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Trigger ADO pipeline 460
        id: trigger
        uses: hmcts/trigger-ado-pipeline@v2
        with:
          pipeline_id: 460
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          template_parameters: >
            {
              "GROUP_ID": "uk.gov.hmcts.cp",
              "ARTIFACT_ID": "${{ env.REPO_NAME }}",
              "ARTIFACT_VERSION": "${{ needs.Artefact-Version.outputs.artefact_version }}",
              "TARGET_REPOSITORY": "${{ github.repository }}",
              "agentDemand": "ubuntu-j25",
              "baseImage": "hmcts/apm-services:25-jre"
            }

  Wait-ACR-Copy:
    needs: [Trigger-ACR-Copy]
    if: ${{ inputs.trigger_deploy }}
    runs-on: ubuntu-latest
    outputs:
      real_tag: ${{ steps.real_tag.outputs.value }}
    steps:
      - name: Wait for ADO pipeline 460
        uses: hmcts/monitor-ado-pipeline@v1
        with:
          pipeline_id: 460
          run_id: ${{ needs.Trigger-ACR-Copy.outputs.run_id }}
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          poll_interval: 30
          timeout: 1800

      # Pipeline 460 (cp-gh-artifact-to-acr) computes its own timestamp
      # suffix internally and prints the exact tag it pushed via
      # `echo "Final IMAGE_TAG: $IMAGE_TAG"` (see
      # hmcts/cpp-azure-devops-templates:pipelines/gh-artifact-to-acr.yaml).
      # Read that back from the run's logs instead of separately guessing
      # a suffix — the two were computed independently and never reliably
      # matched, causing every deploy to reference a non-existent tag
      # (ImagePullBackOff). No change to pipeline 460 needed, and no new
      # Azure credentials — this only reuses the existing HMCTS_ADO_PAT.
      - name: Read real image tag from ADO pipeline 460 logs
        id: real_tag
        shell: bash
        env:
          ADO_PAT: ${{ secrets.HMCTS_ADO_PAT }}
          RUN_ID: ${{ needs.Trigger-ACR-Copy.outputs.run_id }}
        run: |
          AUTH=$(printf ':%s' "$ADO_PAT" | base64 -w0)
          ORG="hmcts-cpp"
          PROJECT="cpp-apps"

          LOG_IDS=$(curl -sf -H "Authorization: Basic ${AUTH}" \
            "https://dev.azure.com/${ORG}/${PROJECT}/_apis/build/builds/${RUN_ID}/logs?api-version=7.1" \
            | jq -r '.value[].id')

          FOUND_LINE=""
          for id in $LOG_IDS; do
            # ADO log content uses CRLF line endings; tr strips the \r so it
            # never ends up embedded in the extracted tag (grep's '.' matches
            # \r, since it only excludes \n, and a trailing \r fails k8s label
            # validation once it flows through to a Helm chart label).
            MATCH=$(curl -sf -H "Authorization: Basic ${AUTH}" \
              "https://dev.azure.com/${ORG}/${PROJECT}/_apis/build/builds/${RUN_ID}/logs/${id}?api-version=7.1" \
              | tr -d '\r' | grep -o 'Final IMAGE_TAG: .*' | tail -1 || true)
            [ -n "$MATCH" ] && FOUND_LINE="$MATCH"
          done

          if [ -z "$FOUND_LINE" ]; then
            echo "::error::Could not find a 'Final IMAGE_TAG:' line in ADO pipeline 460 run ${RUN_ID} logs"
            exit 1
          fi

          FULL_REF="${FOUND_LINE#Final IMAGE_TAG: }"
          REAL_TAG="${FULL_REF##*:}"
          # Positively match only valid Docker tag/k8s label characters
          # instead of stripping specific bad ones. Pipeline 460 runs under
          # set -xe, which prints a second, single-quote-wrapped trace line
          # for the same echo (ADO stores stdout/trace as separate log
          # streams), so a stray quote can end up as the "last match" across
          # logs just as easily as a stray \r. Anchoring on valid characters
          # discards any such garbage regardless of what it is.
          REAL_TAG=$(printf '%s' "$REAL_TAG" | grep -oE '^[A-Za-z0-9._-]+')
          echo "Resolved real tag from ADO logs: ${REAL_TAG}"
          echo "value=${REAL_TAG}" >> "$GITHUB_OUTPUT"

  Deploy-Dev:
    needs: [Wait-ACR-Copy, Artefact-Version, Build]
    if: ${{ inputs.trigger_deploy && inputs.deploy_dev }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via ADO pipeline
        uses: hmcts/action-ado-deploy@v1
        with:
          service_name: service-cp-crime-results-pcr
          image_tag: ${{ needs.Wait-ACR-Copy.outputs.real_tag }}
          app_id: ${{ secrets.DEPLOYMENT_APP_ID }}
          app_private_key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
          target_repository: hmcts/cp-vp-aks-deploy
          target_branch: env/dev
          values_file: vp-config/services_values.yml
          pipeline_id: 434
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          ref_name: refs/heads/env/dev
          template_parameters: >
            {
              "env": "dev",
              "cpbackendenv": "steccm64",
              "stack": "devamp01",
              "cluster": "K8-DEV-CS01-CL01"
            }

  Deploy-Sit:
    needs: [Wait-ACR-Copy, Artefact-Version, Build]
    if: ${{ inputs.trigger_deploy && inputs.deploy_sit }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to SIT via ADO pipeline
        uses: hmcts/action-ado-deploy@v1
        with:
          service_name: service-cp-crime-results-pcr
          image_tag: ${{ needs.Wait-ACR-Copy.outputs.real_tag }}
          app_id: ${{ secrets.DEPLOYMENT_APP_ID }}
          app_private_key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
          target_repository: hmcts/cp-vp-aks-deploy
          target_branch: env/sit
          values_file: vp-config/services_values.yml
          pipeline_id: 434
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          ref_name: refs/heads/env/sit
          wait: false
          template_parameters: >
            {
              "env": "sit",
              "cpbackendenv": "sitccm01",
              "stack": "sitamp01",
              "cluster": "K8-SIT-CS01-CL02"
            }

  # action-ado-deploy now runs with its default wait: true - the job blocks until ADO pipeline
  # 434 completes, and that pipeline's own `helm upgrade --wait` already blocks until Kubernetes
  # confirms the pod is genuinely ready. A separate readiness poll from this GitHub-hosted runner
  # is both redundant and unreachable anyway - devamp01's ingress is on HMCTS's internal network,
  # which ubuntu-latest runners have no route to.
  Smoke-Test-Dev:
    needs: [Deploy-Dev]
    if: ${{ inputs.trigger_deploy && inputs.deploy_dev }}
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Run smoke test against dev
        env:
          SMOKE_SERVICE_BASE_URL: ${{ secrets.DEV_SMOKE_SERVICE_BASE_URL }}
          SMOKE_ENVIRONMENT: dev
          CP_BACKEND_URL: ${{ secrets.DEV_CP_BACKEND_URL }}
          CJSCPPUID: ${{ secrets.CJSCPPUID }}
          SMOKE_ENTRA_TENANT_ID: ${{ secrets.SMOKE_ENTRA_TENANT_ID }}
          SMOKE_ENTRA_CLIENT_ID: ${{ secrets.SMOKE_ENTRA_CLIENT_ID }}
          SMOKE_ENTRA_CLIENT_SECRET: ${{ secrets.SMOKE_ENTRA_CLIENT_SECRET }}
          SMOKE_ENTRA_SCOPE: ${{ secrets.SMOKE_ENTRA_SCOPE }}
          SMOKE_APIM_SUBSCRIPTION_KEY: ${{ secrets.SMOKE_APIM_SUBSCRIPTION_KEY }}
        run: ./gradlew smokeTestSetup smokeTestRun

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-dev-report
          path: build/reports/tests/smokeTest

  # gh release create here triggers ci-released.yml (existing trigger, unchanged), which deploys
  # to SIT. needs: [Smoke-Test-Dev] means a failing dev smoke test makes this - and therefore SIT -
  # unreachable (design doc §6), not just a red pipeline a human has to notice.
  # environment: sit-release-approval holds this job at "Waiting" in the Actions UI until a required
  # reviewer approves - a green dev smoke test is necessary but no longer sufficient to reach SIT
  # (design doc §9, supersedes §6's fully-automatic Auto-Release).
  Auto-Release:
    needs: [Smoke-Test-Dev]
    if: ${{ inputs.trigger_deploy && inputs.deploy_dev }}
    runs-on: ubuntu-latest
    environment:
      name: sit-release-approval
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/generate-release-notes.sh

      - name: Create release
        if: ${{ steps.notes.outputs.has_changes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.notes.outputs.version }} \
            --title "${{ steps.notes.outputs.version }}" \
            --notes-file release-notes.md

