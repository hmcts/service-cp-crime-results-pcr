name: CI Build and Publish – Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-api-spec-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Validate apiSpec version is fixed
        run: ./gradlew validateApiSpecVersions

  ci-release:
    uses: ./.github/workflows/ci-build-publish.yml
    secrets:
      AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
      AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
      HMCTS_ADO_PAT: ${{ secrets.HMCTS_CP_ADO_PAT }}
      DEPLOYMENT_APP_ID: ${{ secrets.DEPLOYMENT_APP_ID }}
      DEPLOYMENT_APP_PRIVATE_KEY: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
      SIT_SMOKE_SERVICE_BASE_URL: ${{ secrets.SIT_SMOKE_SERVICE_BASE_URL }}
      SIT_SMOKE_HEALTH_CHECK_URL: ${{ secrets.SIT_SMOKE_HEALTH_CHECK_URL }}
      SIT_CP_BACKEND_URL: ${{ secrets.SIT_CP_BACKEND_URL }}
      SIT_CJSCPPUID: ${{ secrets.SIT_CJSCPPUID }}
      SIT_SMOKE_ENTRA_TENANT_ID: ${{ secrets.SIT_SMOKE_ENTRA_TENANT_ID }}
      SIT_SMOKE_ENTRA_CLIENT_ID: ${{ secrets.SIT_SMOKE_ENTRA_CLIENT_ID }}
      SIT_SMOKE_ENTRA_CLIENT_SECRET: ${{ secrets.SIT_SMOKE_ENTRA_CLIENT_SECRET }}
      SIT_SMOKE_ENTRA_SCOPE: ${{ secrets.SIT_SMOKE_ENTRA_SCOPE }}
      SIT_SMOKE_APIM_SUBSCRIPTION_KEY: ${{ secrets.SIT_SMOKE_APIM_SUBSCRIPTION_KEY }}
    with:
      environment: dev
      is_release: true
      is_publish: true
      trigger_docker: true
      trigger_deploy: true
      deploy_dev: false
      deploy_sit: true
      deploy_environment: dev
