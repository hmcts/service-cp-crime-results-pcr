services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PCR_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pcrdb
    depends_on:
      - postgres
      - redis
    ports:
      - "8082:8082"
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pcrdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
