// Smoke tests hit a real deployed environment (SMOKE_SERVICE_BASE_URL / CP_BACKEND_URL /
// CJSCPPUID / SMOKE_ENVIRONMENT env vars) - never run as part of build/check/CI unit test flow.
// Setup (drives a real result through the CP backend) and Run (polls the PCR query endpoint) are
// separate tasks because Run's ingestion is asynchronous (real Event Grid delivery, see
// docs/pipeline/specs/2026-08-10-pcr-smoke-test-dev-sit-gate-design.md §3/§5).
// Invoke explicitly: ./gradlew smokeTestSetup smokeTestRun
tasks.register('smokeTestSetup', Test) {
  description = "Drives a real hearing result through the CP backend for smoke testing"
  group = "Verification"

  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = sourceSets.smokeTest.runtimeClasspath
  useJUnitPlatform()
  filter {
    includeTestsMatching "uk.gov.hmcts.cp.smoketest.SetupCreatePcrCaseSmokeTest"
  }

  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
    showStandardStreams = true
  }
  reports {
    junitXml.required.set(true)
    junitXml.outputPerTestCase = true
    junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/smokeTest'))
    html.required.set(true)
    html.outputLocation.set(layout.buildDirectory.dir('reports/tests/smokeTest'))
  }
}

tasks.register('smokeTestRun', Test) {
  description = "Polls the PCR query endpoint for the result recorded by Setup"
  group = "Verification"

  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = sourceSets.smokeTest.runtimeClasspath
  useJUnitPlatform()
  filter {
    includeTestsMatching "uk.gov.hmcts.cp.smoketest.RunCheckPcrResultSmokeTest"
  }

  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
    showStandardStreams = true
  }
  reports {
    junitXml.required.set(true)
    junitXml.outputPerTestCase = true
    junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/smokeTest'))
    html.required.set(true)
    html.outputLocation.set(layout.buildDirectory.dir('reports/tests/smokeTest'))
  }
}

sourceSets {
  smokeTest {
    java {
      compileClasspath += sourceSets.main.output
      runtimeClasspath += sourceSets.main.output
    }
  }
}

// Self-contained runnable jar for smokeTestSetup only - the piece that has to run inside ADO
// pipeline 434, which can't reach Maven Central/Gradle's own distribution server (confirmed by a
// throwaway pipeline 460 test - see docs/designs/2026-08-27-pcr-dev-smoke-test-release-gate-design.md
// §5). Built here in GitHub Actions, where every dependency below is already resolved by the
// normal build; SmokeTestRunner (JUnit Platform Launcher API, not Gradle) is the entry point so
// running it needs only a JRE, not Gradle. No shadow plugin - smokeTest has exactly one
// TestEngine (junit-jupiter-engine, vintage excluded elsewhere in build.gradle), so there's no
// META-INF/services merge conflict a plain zipTree concatenation would silently break.
tasks.register('smokeTestSetupJar', Jar) {
  description = "Self-contained runnable jar for smokeTestSetup (SmokeTestRunner entry point)"
  group = "Verification"

  archiveBaseName.set('smoke-test-setup')
  zip64 = true
  manifest {
    attributes('Main-Class': 'uk.gov.hmcts.cp.smoketest.SmokeTestRunner')
  }
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  from(sourceSets.smokeTest.output)
  from(sourceSets.main.output)
  from({
    configurations.smokeTestRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }) {
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
  }
}

configurations {
  smokeTestImplementation.extendsFrom testImplementation
  smokeTestRuntimeOnly.extendsFrom testRuntimeOnly
  smokeTestCompileOnly.extendsFrom testCompileOnly
  smokeTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

// pmdTest is disabled repo-wide (gradle/pmd.gradle) since PMD's test-oriented rules don't apply
// meaningfully to test code - smokeTest gets the same treatment for the same reason. Declared here
// rather than in pmd.gradle because pmd.gradle is applied before this file (build.gradle), so
// pmdSmokeTest doesn't exist yet at that point.
tasks.named("pmdSmokeTest").configure {
  enabled = false
}
