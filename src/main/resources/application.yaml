environment:
  name: ${ENVIRONMENT_NAME:UNKNOWN}

spring:
  application:
    name: service-cp-crime-results-pcr
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    open-in-view: false
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pcrdb}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8082}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
  health:
    redis:
      # Redis is a read-optimisation this service falls back off of (§3.3 completeness
      # check) — a Redis outage degrades hearing ingestion but shouldn't take the
      # synchronous PCR API's readiness probe down with it.
      enabled: false
    db:
      # No JPA entities/repositories read or write this datasource yet (data-store design
      # doc §7 config only, added ahead of that work) — don't fail the readiness probe on
      # a database nothing in this service actually depends on today.
      enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO

results-query-client:
  url: ${CP_BACKEND_URL:http://localhost:8081}
  cjscppuid: ${CJSCPPUID:00000000-0000-0000-0000-000000000000}

reference-data-client:
  url: ${CP_BACKEND_URL:http://localhost:8081}
  cjscppuid: ${CJSCPPUID:00000000-0000-0000-0000-000000000000}

service-bus:
  # Emulator vs Azure is detected automatically from the connection string (https = Azure, sb:// = emulator).
  # Same shared per-environment namespace as service-cp-crime-hearing-results-document-subscription (ADR-009).
  admin-connection: ${AZURE_SERVICE_BUS_ADMIN_URI:Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
  connection: ${AZURE_SERVICE_BUS_URI:Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
  topic-name: ${SERVICE_BUS_TOPIC_NAME:hearing-resulted}
  subscription-name: ${SERVICE_BUS_SUBSCRIPTION_NAME:pcr}
  # Whether the consumer provisions/connects at all — separate from ingestion-enabled (which
  # channel persists). Off by default everywhere (ADR-009 — "off by default in every
  # environment"), same posture as ingestion-enabled: nothing should attempt to connect until an
  # environment explicitly opts in. Also keeps CI/DAST/local `docker compose up` app-container
  # boots fast, since @PostConstruct would otherwise block Spring context refresh polling a
  # Service Bus endpoint nothing has configured yet.
  auto-start-processors: ${SERVICE_BUS_AUTO_START_PROCESSORS:false}
  # Off by default everywhere (ADR-009) — enabled per-environment only once the Service Bus
  # path is validated end-to-end; never true alongside the relay function in the same environment.
  ingestion-enabled: ${SERVICE_BUS_INGESTION_ENABLED:false}
