environment:
  name: ${ENVIRONMENT_NAME:UNKNOWN}

spring:
  application:
    name: service-cp-crime-results-pcr
  data:
    redis:
      host: ${CP_REDIS_HOST:localhost}
      port: ${CP_REDIS_PORT:6379}
      password: ${CP_REDIS_PASSWORD:}
      ssl:
        enabled: ${CP_REDIS_SSL_ENABLED:false}
  jpa:
    open-in-view: false
  datasource:
    url: ${PCR_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pcrdb}
    username: ${PCR_DATASOURCE_USERNAME:postgres}
    password: ${PCR_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8082}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
  health:
    redis:
      # Redis is a read-optimisation this service falls back off of (§3.3 completeness
      # check) — a Redis outage degrades hearing ingestion but shouldn't take the
      # synchronous PCR API's readiness probe down with it.
      enabled: false
    db:
      # No JPA entities/repositories read or write this datasource yet (data-store design
      # doc §7 config only, added ahead of that work) — don't fail the readiness probe on
      # a database nothing in this service actually depends on today.
      enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO

results-query-client:
  url: ${CP_BACKEND_URL:http://localhost:8081}
  cjscppuid: ${CJSCPPUID:00000000-0000-0000-0000-000000000000}

reference-data-client:
  # Real dev/SIT host unconfirmed (design doc §7 — no non-localhost value exists in
  # cpp-context-azure-legalaidagency) — defaults to CP_BACKEND_URL as a placeholder since
  # service-cp-refdata-courthearing-courthouses already reaches referencedata-query-api from
  # this org's AKS fleet; confirm the real value before this reaches a live environment.
  url: ${REFERENCE_DATA_URL:${CP_BACKEND_URL:http://localhost:8081}}
  cjscppuid: ${CJSCPPUID:00000000-0000-0000-0000-000000000000}
